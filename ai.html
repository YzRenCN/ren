
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暗恋信号检测器 | Crush Detector</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&family=Pacifico&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #4a4a4a;
            overflow-x: hidden;
        }

        .romantic-font {
            font-family: 'Pacifico', cursive;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.2);
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
        }

        .option-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #eee;
        }

        .option-card:hover {
            border-color: #ff9a9e;
            background-color: #fff5f7;
        }

        .option-selected {
            border-color: #ff9a9e;
            background-color: #ffeef2;
            box-shadow: 0 0 0 2px rgba(255, 154, 158, 0.2);
        }

        /* Heart Animation */
        .heart-beat {
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-[url('https://picsum.photos/1920/1080?blur=2')] bg-cover bg-center bg-fixed">
    
    <!-- Overlay for softness -->
    <div class="fixed inset-0 bg-pink-50/30 z-0"></div>

    <!-- Main Container -->
    <main id="app-container" class="w-full max-w-3xl glass-panel rounded-3xl overflow-hidden min-h-[600px] relative z-10 flex flex-col">
        
        <!-- Header -->
        <header class="p-6 border-b border-pink-100 flex justify-between items-center bg-white/50">
            <div class="flex items-center gap-3">
                <i class="fas fa-heart text-pink-500 text-2xl heart-beat"></i>
                <h1 class="text-2xl font-bold tracking-wider text-gray-700 romantic-font">Crush Detector</h1>
            </div>
            <button onclick="showHistory()" class="text-gray-400 hover:text-pink-500 transition">
                <i class="fas fa-history"></i> 档案
            </button>
        </header>

        <!-- Content Area -->
        <div class="flex-grow relative">
            
            <!-- View: Welcome -->
            <div id="view-welcome" class="absolute inset-0 flex flex-col items-center justify-center p-8 text-center fade-in">
                <img src="https://picsum.photos/400/300?random=1&grayscale" alt="Romantic silhouette of two people" class="rounded-2xl shadow-xl mb-6 border-4 border-white w-full max-w-md object-cover h-64 opacity-90 hover:opacity-100 transition duration-500">
                <h2 class="text-3xl font-bold text-gray-800 mb-4">TA喜欢你吗？</h2>
                <p class="text-gray-500 mb-8 max-w-lg">
                    眼神的躲闪、不经意的触碰、特殊的对待...<br>
                    通过12个微表情与行为细节，解析TA潜意识里的喜欢指数。<br>
                    <span class="text-pink-500 text-sm mt-2 block"><i class="fas fa-magic"></i> 爱情心理学趣味测试</span>
                </p>
                <div class="flex gap-4">
                    <button onclick="startTest()" class="btn-primary font-bold py-3 px-10 rounded-full shadow-lg">
                        开始探测
                    </button>
                </div>
            </div>

            <!-- View: Quiz -->
            <div id="view-quiz" class="hidden absolute inset-0 flex flex-col p-8">
                <!-- Progress -->
                <div class="w-full bg-gray-100 rounded-full h-2 mb-6">
                    <div id="progress-bar" class="bg-pink-400 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                
                <div class="flex justify-between text-xs text-gray-400 mb-2 uppercase tracking-widest">
                    <span id="question-counter">Question 1/12</span>
                    <span id="category-tag">Body Language</span>
                </div>

                <div id="question-container" class="flex-grow flex flex-col justify-center fade-in">
                    <h3 id="question-text" class="text-xl md:text-2xl font-bold text-gray-700 mb-8 leading-relaxed">
                        Loading...
                    </h3>
                    
                    <div class="space-y-4">
                        <button onclick="selectOption('A')" id="btn-a" class="option-card w-full p-5 rounded-xl text-left group bg-white">
                            <div class="flex items-center">
                                <span class="w-8 h-8 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center font-bold mr-4 group-hover:bg-pink-500 group-hover:text-white transition">A</span>
                                <span id="text-a" class="text-gray-600 group-hover:text-pink-600">Option A</span>
                            </div>
                        </button>
                        
                        <button onclick="selectOption('B')" id="btn-b" class="option-card w-full p-5 rounded-xl text-left group bg-white">
                            <div class="flex items-center">
                                <span class="w-8 h-8 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center font-bold mr-4 group-hover:bg-pink-500 group-hover:text-white transition">B</span>
                                <span id="text-b" class="text-gray-600 group-hover:text-pink-600">Option B</span>
                            </div>
                        </button>

                         <button onclick="selectOption('C')" id="btn-c" class="option-card w-full p-5 rounded-xl text-left group bg-white hidden">
                            <div class="flex items-center">
                                <span class="w-8 h-8 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center font-bold mr-4 group-hover:bg-pink-500 group-hover:text-white transition">C</span>
                                <span id="text-c" class="text-gray-600 group-hover:text-pink-600">Option C</span>
                            </div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- View: Loading -->
            <div id="view-loading" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-white/95 z-20">
                <div class="relative w-24 h-24 mb-4">
                    <i class="fas fa-heart absolute inset-0 flex items-center justify-center text-pink-500 text-4xl heart-beat"></i>
                </div>
                <h3 class="text-xl text-pink-500 font-medium animate-pulse">分析情感信号中...</h3>
            </div>

            <!-- View: Result -->
            <div id="view-result" class="hidden absolute inset-0 overflow-y-auto p-8">
                <div class="text-center mb-8">
                    <div class="inline-block p-4 rounded-full bg-pink-100 mb-4">
                        <i class="fas fa-cupid text-4xl text-pink-500"></i>
                    </div>
                    <h2 class="text-4xl font-bold text-gray-800 mb-2 romantic-font" id="result-title">TYPE</h2>
                    <p class="text-pink-500 text-lg font-medium mb-4" id="result-subtitle">Subtitle</p>
                    <p class="text-gray-500 text-sm leading-relaxed max-w-xl mx-auto" id="result-desc">Description</p>
                </div>

                <div class="bg-white rounded-xl p-6 mb-8 border border-pink-100 shadow-sm">
                    <h4 class="text-gray-600 font-bold mb-4 text-center">心动维度分析</h4>
                    <div class="h-64 w-full">
                        <canvas id="resultChart"></canvas>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                    <div class="bg-pink-50/50 p-4 rounded-lg border-l-4 border-pink-400">
                        <h5 class="text-pink-600 font-bold mb-2"><i class="fas fa-check-circle mr-2"></i>积极信号</h5>
                        <ul id="positives-list" class="text-sm text-gray-600 space-y-1 list-disc list-inside"></ul>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg border-l-4 border-gray-400">
                        <h5 class="text-gray-600 font-bold mb-2"><i class="fas fa-exclamation-circle mr-2"></i>注意事项</h5>
                        <ul id="warnings-list" class="text-sm text-gray-500 space-y-1 list-disc list-inside"></ul>
                    </div>
                </div>

                <div class="flex flex-wrap justify-center gap-4">
                    <button onclick="restartTest()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 px-6 rounded-lg transition">
                        <i class="fas fa-redo mr-2"></i>重测
                    </button>
                    <button onclick="saveResult()" id="btn-save" class="bg-pink-500 hover:bg-pink-600 text-white py-2 px-6 rounded-lg transition shadow-lg shadow-pink-200">
                        <i class="fas fa-save mr-2"></i>保存结果
                    </button>
                </div>
            </div>

            <!-- View: History -->
            <div id="view-history" class="hidden absolute inset-0 overflow-y-auto p-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-700">探测档案库</h2>
                    <button onclick="backToWelcome()" class="text-gray-400 hover:text-pink-500"><i class="fas fa-arrow-left"></i> 返回</button>
                </div>
                <div id="history-list" class="space-y-3">
                    <!-- Items -->
                </div>
                <div class="mt-8 text-center">
                     <button onclick="clearHistory()" class="text-red-400 hover:text-red-500 text-sm underline">清空所有档案</button>
                </div>
            </div>

        </div>
    </main>

    <footer class="mt-6 text-gray-400 text-xs z-10">
        &copy; 2026 Crush Detector. For Entertainment Only.
    </footer>

    <script src="script.js"></script>
</body>
</html>
